# Experiment 1: Positional Encoding Ablation
# Compare none vs absolute positional encodings

name: exp1_positional_encoding
data_path: data/gutenberg_subset/all_books.txt
output_dir: outputs/

# Model
embedding_dim: 384
num_layers: 6
num_heads: 6
context_length: 256
dropout: 0.2

# Training
max_iters: 2000
batch_size: 64
learning_rate: 3e-4
warmup_iters: 100
eval_interval: 100
eval_iters: 50
use_mixed_precision: true
gradient_accumulation: 1
seed: 1337
