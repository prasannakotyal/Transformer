# Experiment 3: Attention Analysis
# Train with attention capture for visualization

name: exp3_attention
data_path: data/gutenberg_subset/all_books.txt
output_dir: outputs/

# Model
embedding_dim: 384
num_layers: 6
num_heads: 6
context_length: 256
dropout: 0.2
return_attention: true

# Training
max_iters: 2000
batch_size: 64
learning_rate: 3e-4
warmup_iters: 100
eval_interval: 100
eval_iters: 50
use_mixed_precision: true
gradient_accumulation: 1
seed: 1337
